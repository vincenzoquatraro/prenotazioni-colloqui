<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colloqui – Cuore di Mamma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
    <link rel="icon" href="logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<a href="admin.html" class="admin-link" aria-label="Area docenti" title="Area docenti">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
</a>

<div class="app">

    <header>
        <img class="logo" src="logo.png" alt="Cuore di Mamma" width="120" height="126">
        <div class="badge">COLLOQUI DOCENTI</div>
        <h1>Prenota il tuo colloquio</h1>
        <p>Scegli il docente, il giorno e uno degli appuntamenti disponibili da 15 minuti.</p>
    </header>

    <main>

        <section class="card">
            <div class="step"><span class="step-num">1</span><label for="docente" style="margin:0;color:inherit;font-size:inherit">Docente</label></div>
            <select id="docente">
                <option value="">Caricamento docenti...</option>
            </select>
        </section>

        <section class="card">
            <div class="step"><span class="step-num">2</span>Giorno</div>
            <div id="date-container" class="chips" role="group" aria-label="Giorni disponibili">
                <div class="empty">Prima scegli un docente</div>
            </div>
        </section>

        <section class="card">
            <div class="step"><span class="step-num">3</span>Orario</div>
            <div id="slot-container" class="slots" role="group" aria-label="Orari disponibili">
                <div class="empty">Scegli docente e giorno</div>
            </div>
        </section>

        <section id="dati-card" class="card hidden">
            <div class="step"><span class="step-num">4</span>I tuoi dati</div>

            <div id="riepilogo" class="summary"></div>

            <div class="field">
                <label for="genitore">Nome e cognome del genitore</label>
                <input id="genitore" type="text" placeholder="Mario Rossi" autocomplete="name">
            </div>

            <div class="grid-2">
                <div class="field">
                    <label for="alunno">Nome e cognome dell'alunno</label>
                    <input id="alunno" type="text" placeholder="Luca Rossi">
                </div>
                <div class="field">
                    <label for="classe">Classe</label>
                    <input id="classe" type="text" placeholder="2B">
                </div>
            </div>

            <button id="prenota-btn" class="primary">Conferma prenotazione</button>
        </section>

        <div id="message" role="status" aria-live="polite"></div>

    </main>

</div>

<script src="app.js"></script>
</body>
</html>
