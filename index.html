<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colloqui – Cuore di Mamma</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap">
    <link rel="icon" href="logo.png">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="hero">
    <div class="hero-inner">
        <div class="hero-top">
            <button id="hero-back" class="hero-btn hidden" type="button" aria-label="Indietro">‹</button>
            <h1 class="hero-title">Prenotazione colloqui</h1>
        </div>
        <div id="hero-sel" class="hero-sel invisible">
            <span id="hero-avatar"></span>
            <div>
                <div id="hero-titolo" class="hero-label"></div>
                <div id="hero-nome" class="hero-name"></div>
                <div class="hero-chips">
                    <span id="chip-giorno" class="hero-chip hidden"></span>
                    <span id="chip-ora" class="hero-chip hidden"></span>
                </div>
            </div>
        </div>
    </div>
</header>

<main class="app">

    <section id="view-docenti" class="view">
        <div class="view-head">
            <h2 class="view-title">Scegli la maestra</h2>
            <a href="admin.html" class="back" aria-label="Area docenti" title="Area docenti">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
            </a>
        </div>
        <div id="docenti-grid" class="teacher-grid">
            <div class="teacher-card skeleton-card"></div>
            <div class="teacher-card skeleton-card"></div>
            <div class="teacher-card skeleton-card"></div>
            <div class="teacher-card skeleton-card"></div>
        </div>
    </section>

    <section id="view-calendario" class="view hidden">
        <h2 class="view-title">Scegli il giorno</h2>
        <div class="card">
            <div class="cal-nav">
                <button id="cal-prev" class="back" type="button" aria-label="Mese precedente">‹</button>
                <div id="cal-titolo" class="cal-title"></div>
                <button id="cal-next" class="back" type="button" aria-label="Mese successivo">›</button>
            </div>
            <div id="calendario" class="cal-grid" role="grid"></div>
        </div>
    </section>

    <section id="view-orari" class="view hidden">
        <h2 class="view-title">Scegli l'orario</h2>
        <div class="card">
            <div id="slot-container" class="slots" role="group" aria-label="Orari disponibili"></div>
        </div>
    </section>

    <section id="view-dati" class="view hidden">
        <h2 id="titolo-dati" class="view-title">I tuoi dati</h2>

        <form id="dati-form" class="card" novalidate>
            <div class="grid-2">
                <div class="field">
                    <label for="genitore">Genitore</label>
                    <input id="genitore" type="text" placeholder="Mario Rossi" autocomplete="name" required>
                </div>
                <div class="field">
                    <label for="alunno">Alunno</label>
                    <input id="alunno" type="text" placeholder="Luca Rossi" required>
                </div>
            </div>
            <div class="grid-2 grid-email">
                <div class="field">
                    <label for="email">Email</label>
                    <input id="email" type="email" placeholder="mario@email.it" autocomplete="email" required aria-describedby="email-hint">
                </div>
                <div class="field">
                    <label for="classe">Classe</label>
                    <input id="classe" type="text" placeholder="2B" required>
                </div>
            </div>
            <p id="email-hint" class="hint">📅 All'email riceverai in automatico l'invito al colloquio sul tuo calendario.</p>
            <div id="message" role="status" aria-live="polite"></div>
            <button id="prenota-btn" class="primary" type="submit">Conferma prenotazione</button>
        </form>

        <div id="successo" class="card success-card hidden">
            <div class="success-icon" aria-hidden="true">✓</div>
            <div class="card-title">Prenotazione confermata</div>
            <p id="successo-testo"></p>
            <button id="nuova-btn" class="primary" type="button">Prenota un altro colloquio</button>
        </div>
    </section>

</main>

<script src="app.js"></script>
</body>
</html>
